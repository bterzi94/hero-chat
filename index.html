<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gebäudereinigung – Kostenloses Angebot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar__left">
        <div class="topbar__logo">
          <span class="topbar__logo-icon">✦</span>
          brandheiss.Agency
        </div>
      </div>
      <div class="topbar__center">
        Gebäudereinigung · Angebotsassistent
      </div>
      <div class="topbar__right">
        <span class="topbar__status">
          <span class="topbar__status-dot"></span>
          Bereit
        </span>
      </div>
    </header>

    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-bar__fill" id="progressBar"></div>
    </div>

    <!-- Messages -->
    <main class="messages" id="chatMessages"></main>

    <!-- Input Footer -->
    <footer class="composer" id="chatFooter">
      <div class="composer__inner">
        <div class="composer__wrapper" id="inputWrapper">
          <input
            class="composer__input"
            id="chatInput"
            type="text"
            autocomplete="off"
          />
          <button class="composer__send" id="sendBtn" aria-label="Senden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <button class="composer__skip" id="skipBtn" style="display:none">
          Überspringen →
        </button>
        <p class="composer__disclaimer">
          Schritt <span id="stepCounter">0 / 7</span> · Mit dem Absenden akzeptierst du unsere <a href="#" class="composer__disclaimer-link">Datenschutzerklärung</a>.
        </p>
      </div>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="chat.js"></script>
</body>
</html>
